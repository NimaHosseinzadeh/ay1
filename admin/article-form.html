<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>افزودن مقاله | Aynim</title>
  <link rel="icon" href="../assets/images/aynim-high-resolution-logo.png">
  <link rel="stylesheet" href="../assets/icons/remixicon/remixicon.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="dashboard.html" class="sidebar__logo"><img src="../assets/images/aynim-high-resolution-logo.png" alt="Aynim"></a>
    <nav class="sidebar__nav" aria-label="منوی مدیریت">
        <a href="dashboard.html"><i class="ri-dashboard-line"></i> داشبورد</a>
        <a href="orders.html"><i class="ri-shopping-bag-3-line"></i> سفارش‌ها</a>
        <a href="products.html"><i class="ri-price-tag-3-line"></i> محصولات</a>
        <a href="customers.html"><i class="ri-group-line"></i> مشتری‌ها</a>
        <a href="articles.html" class="is-active"><i class="ri-article-line"></i> مقالات</a>
        <a href="settings.html"><i class="ri-settings-3-line"></i> تنظیمات</a>
      <a href="../index.html" class="sidebar__out"><i class="ri-external-link-line"></i> مشاهده سایت</a>
    </nav>
  </aside>

  <div class="admin__main">

    <!-- Top bar -->
    <header class="topbar">
      <h1 class="topbar__title">افزودن مقاله</h1>
      <form class="topbar__search" role="search">
        <i class="ri-search-line"></i>
        <input type="search" placeholder="جستجوی سفارش یا مشتری" aria-label="جستجو">
      </form>
      <button class="topbar__bell" aria-label="اعلان‌ها"><i class="ri-notification-3-line"></i><span class="topbar__dot"></span></button>
      <div class="topbar__user">
        <span class="topbar__avatar">ا</span>
        <span>مدیر سایت</span>
      </div>
    </header>
    <main class="content">

      <form class="product-form">
        <div class="detail__main">
          <section class="box">
            <h2 class="box__title">محتوای مقاله</h2>
            <div class="form-grid">
              <label class="form-field form-field--wide"><span>عنوان</span><input type="text" required></label>
              <label class="form-field"><span>دسته‌بندی</span><select><option>مد و استایل</option><option>راهنمای خرید</option><option>ست لباس</option><option>نگهداری لباس</option></select></label>
              <label class="form-field"><span>زمان مطالعه (دقیقه)</span><input type="number" min="1" value="4"></label>
              <label class="form-field form-field--wide"><span>خلاصه</span><textarea rows="2"></textarea></label>
              <label class="form-field form-field--wide"><span>متن مقاله</span><textarea rows="12"></textarea></label>
            </div>
          </section>
        </div>
        <div class="detail__side">
          <section class="box">
            <h2 class="box__title">تصویر شاخص</h2>
            <label class="upload"><i class="ri-image-add-line"></i><span>انتخاب تصویر</span><small>JPG یا PNG، حداکثر ۲ مگابایت</small><input type="file" accept="image/*"></label>
          </section>
          <section class="box">
            <h2 class="box__title">انتشار</h2>
            <label class="switch-row"><span>منتشر شود</span><span class="switch"><input type="checkbox" checked><span></span></span></label>
          </section>
          <div class="form-actions">
            <button class="btn btn--primary">ذخیره مقاله</button>
            <a href="articles.html" class="btn btn--dark">انصراف</a>
          </div>
        </div>
      </form>
    </main>
  </div>

</body>
</html>
