<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>افزودن محصول | Aynim</title>
  <link rel="icon" href="../assets/images/aynim-high-resolution-logo.png">
  <link rel="stylesheet" href="../assets/icons/remixicon/remixicon.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="dashboard.html" class="sidebar__logo"><img src="../assets/images/aynim-high-resolution-logo.png" alt="Aynim"></a>
    <nav class="sidebar__nav" aria-label="منوی مدیریت">
        <a href="dashboard.html"><i class="ri-dashboard-line"></i> داشبورد</a>
        <a href="orders.html"><i class="ri-shopping-bag-3-line"></i> سفارش‌ها</a>
        <a href="products.html" class="is-active"><i class="ri-price-tag-3-line"></i> محصولات</a>
        <a href="customers.html"><i class="ri-group-line"></i> مشتری‌ها</a>
        <a href="articles.html"><i class="ri-article-line"></i> مقالات</a>
        <a href="settings.html"><i class="ri-settings-3-line"></i> تنظیمات</a>
      <a href="../index.html" class="sidebar__out"><i class="ri-external-link-line"></i> مشاهده سایت</a>
    </nav>
  </aside>

  <div class="admin__main">

    <!-- Top bar -->
    <header class="topbar">
      <h1 class="topbar__title">افزودن محصول</h1>
      <form class="topbar__search" role="search">
        <i class="ri-search-line"></i>
        <input type="search" placeholder="جستجوی سفارش یا مشتری" aria-label="جستجو">
      </form>
      <button class="topbar__bell" aria-label="اعلان‌ها"><i class="ri-notification-3-line"></i><span class="topbar__dot"></span></button>
      <div class="topbar__user">
        <span class="topbar__avatar">ا</span>
        <span>مدیر سایت</span>
      </div>
    </header>

    <main class="content">

      <form class="product-form">

        <!-- Main fields -->
        <div class="detail__main">
          <section class="box">
            <h2 class="box__title">اطلاعات محصول</h2>
            <div class="form-grid">
              <label class="form-field form-field--wide">
                <span>نام محصول</span>
                <input type="text" placeholder="مثلا: تی شرت دو رو چاپ مردانه" required>
              </label>
              <label class="form-field">
                <span>کد محصول</span>
                <input type="text" placeholder="۰۳۷" required>
              </label>
              <label class="form-field">
                <span>دسته‌بندی</span>
                <select>
                  <option>زنانه</option>
                  <option>مردانه</option>
                  <option>بچه‌گانه</option>
                </select>
              </label>
              <label class="form-field form-field--wide">
                <span>توضیحات</span>
                <textarea rows="5" placeholder="ویژگی‌ها، جنس و نکات نگهداری"></textarea>
              </label>
            </div>
          </section>

          <section class="box">
            <h2 class="box__title">قیمت و موجودی</h2>
            <div class="form-grid">
              <label class="form-field">
                <span>قیمت (تومان)</span>
                <input type="number" min="0" required>
              </label>
              <label class="form-field">
                <span>قیمت با تخفیف (اختیاری)</span>
                <input type="number" min="0">
              </label>
              <label class="form-field">
                <span>موجودی</span>
                <input type="number" min="0" value="0">
              </label>
            </div>
          </section>

          <section class="box">
            <h2 class="box__title">سایز و رنگ</h2>
            <div class="form-grid">
              <div class="form-field form-field--wide">
                <span>سایزها</span>
                <div class="options"><label class="chip"><input type="checkbox"><span>S</span></label><label class="chip"><input type="checkbox" checked><span>M</span></label><label class="chip"><input type="checkbox" checked><span>L</span></label><label class="chip"><input type="checkbox"><span>XL</span></label><label class="chip"><input type="checkbox"><span>XXL</span></label></div>
              </div>
              <div class="form-field form-field--wide">
                <span>رنگ‌ها</span>
                <div class="options"><label class="swatch"><input type="checkbox" aria-label="مشکی"><span style="background:#222"></span></label><label class="swatch"><input type="checkbox" aria-label="آبی"><span style="background:#3d6bd1"></span></label><label class="swatch"><input type="checkbox" aria-label="قرمز"><span style="background:#b0323c"></span></label><label class="swatch"><input type="checkbox" aria-label="سبز"><span style="background:#5cb88a"></span></label><label class="swatch"><input type="checkbox" aria-label="کرم"><span style="background:#e8a35c"></span></label><label class="swatch"><input type="checkbox" aria-label="طوسی"><span style="background:#8b93a1"></span></label></div>
              </div>
            </div>
          </section>
        </div>

        <!-- Side fields -->
        <div class="detail__side">
          <section class="box">
            <h2 class="box__title">تصویر محصول</h2>
            <label class="upload">
              <i class="ri-image-add-line"></i>
              <span>انتخاب تصویر</span>
              <small>JPG یا PNG، حداکثر ۲ مگابایت</small>
              <input type="file" accept="image/*">
            </label>
          </section>

          <section class="box">
            <h2 class="box__title">وضعیت</h2>
            <label class="switch-row">
              <span>نمایش در فروشگاه</span>
              <span class="switch"><input type="checkbox" checked><span></span></span>
            </label>
            <label class="switch-row">
              <span>نشان «جدید»</span>
              <span class="switch"><input type="checkbox"><span></span></span>
            </label>
          </section>

          <div class="form-actions">
            <button class="btn btn--primary">ذخیره محصول</button>
            <a href="products.html" class="btn btn--dark">انصراف</a>
          </div>
        </div>
      </form>
    </main>
  </div>

</body>
</html>
