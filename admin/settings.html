<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تنظیمات | Aynim</title>
  <link rel="icon" href="../assets/images/aynim-high-resolution-logo.png">
  <link rel="stylesheet" href="../assets/icons/remixicon/remixicon.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="dashboard.html" class="sidebar__logo"><img src="../assets/images/aynim-high-resolution-logo.png" alt="Aynim"></a>
    <nav class="sidebar__nav" aria-label="منوی مدیریت">
        <a href="dashboard.html"><i class="ri-dashboard-line"></i> داشبورد</a>
        <a href="orders.html"><i class="ri-shopping-bag-3-line"></i> سفارش‌ها</a>
        <a href="products.html"><i class="ri-price-tag-3-line"></i> محصولات</a>
        <a href="customers.html"><i class="ri-group-line"></i> مشتری‌ها</a>
        <a href="articles.html"><i class="ri-article-line"></i> مقالات</a>
        <a href="settings.html" class="is-active"><i class="ri-settings-3-line"></i> تنظیمات</a>
      <a href="../index.html" class="sidebar__out"><i class="ri-external-link-line"></i> مشاهده سایت</a>
    </nav>
  </aside>

  <div class="admin__main">

    <!-- Top bar -->
    <header class="topbar">
      <h1 class="topbar__title">تنظیمات</h1>
      <form class="topbar__search" role="search">
        <i class="ri-search-line"></i>
        <input type="search" placeholder="جستجوی سفارش یا مشتری" aria-label="جستجو">
      </form>
      <button class="topbar__bell" aria-label="اعلان‌ها"><i class="ri-notification-3-line"></i><span class="topbar__dot"></span></button>
      <div class="topbar__user">
        <span class="topbar__avatar">ا</span>
        <span>مدیر سایت</span>
      </div>
    </header>
    <main class="content">

      <form class="settings">
        <section class="box">
          <h2 class="box__title">اطلاعات فروشگاه</h2>
          <div class="form-grid">
            <label class="form-field"><span>نام فروشگاه</span><input type="text" placeholder="" value="آینیم"></label>
            <label class="form-field"><span>شماره تماس</span><input type="tel" placeholder="" value="۰۹۰۱۷۷۶۶۴۰۵"></label>
            <label class="form-field"><span>ایمیل</span><input type="email" placeholder="" value="aynim@gmail.com"></label>
            <label class="form-field"><span>اینستاگرام</span><input type="text" placeholder="" value="AYNIM"></label>
            <label class="form-field form-field--wide"><span>آدرس فروشگاه</span><input type="text" placeholder="" value="یزد - فروشگاه آینیم"></label>
          </div>
        </section>
        <section class="box">
          <h2 class="box__title">ارسال</h2>
          <div class="form-grid">
            <label class="form-field"><span>حداقل خرید برای ارسال رایگان (تومان)</span><input type="number" placeholder="" value="1000000"></label>
            <label class="form-field"><span>هزینه پیک موتوری یزد (تومان)</span><input type="number" placeholder="" value="80000"></label>
          </div>
        </section>
        <section class="box">
          <h2 class="box__title">پرداخت</h2>
          <div class="form-grid">
            <label class="form-field form-field--wide"><span>مرچنت کد زرین‌پال</span><input type="text" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"></label>
          </div>
          <label class="switch-row"><span>درگاه آنلاین فعال باشد</span><span class="switch"><input type="checkbox" checked><span></span></span></label>
        </section>
        <button class="btn btn--primary settings__save">ذخیره تنظیمات</button>
      </form>
    </main>
  </div>

</body>
</html>
